<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=block" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MotionPathPlugin.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--f:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;--up:#22e55c;--upd:#0f8a34;--down:#ff2d3a;--downd:#9b0f19;--ink:#f4f6fa;--dim:#9aa3b2}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05070c}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--f);color:var(--ink);letter-spacing:-.02em}
.clip{position:absolute;inset:0;width:1920px;height:1080px}
/* background worlds */
.bgl{position:absolute;inset:0;opacity:0}
#b_n{background:radial-gradient(1100px 600px at 50% -10%,rgba(80,110,160,.30),transparent 70%),linear-gradient(180deg,#1a2233 0%,#0b1220 36%,#05070c 100%)}
#b_g{background:radial-gradient(900px 560px at 50% 112%,rgba(34,229,92,.30),transparent 70%),radial-gradient(800px 500px at 88% -6%,rgba(34,229,92,.16),transparent 70%),linear-gradient(180deg,#152a22 0%,#08140f 38%,#04080a 100%)}
#b_r{background:radial-gradient(900px 600px at 0% 0%,rgba(255,45,58,.42),transparent 70%),radial-gradient(1000px 520px at 100% 110%,rgba(255,45,58,.28),transparent 70%),linear-gradient(180deg,#2a1216 0%,#12070a 40%,#060406 100%)}
#dust i{position:absolute;display:block;border-radius:50%;background:#dfe8f5}
#sweep i{position:absolute;border-radius:50%;filter:blur(90px)}#sweep .sw1{left:-300px;top:120px;width:900px;height:520px;background:rgba(150,200,255,.10)}#sweep .sw2{left:1300px;top:520px;width:800px;height:500px;background:rgba(34,229,92,.10)}
#vig{position:absolute;inset:0;background:radial-gradient(1300px 820px at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
.scene{z-index:2}.cam,.push{position:absolute;inset:0;transform-origin:50% 50%}
/* captions: two-tier kinetic text */
.cap{position:absolute;left:0;right:0;text-align:center;letter-spacing:-.035em;line-height:1.02;z-index:9;perspective:900px}
.cap .l1{font-weight:400;font-size:64px}.cap .l2{font-weight:700;font-size:74px;margin-top:4px}
.w{display:inline-block;white-space:pre}.w.up{color:var(--up);text-shadow:0 0 34px rgba(34,229,92,.55)}
/* glass, pills, labels */
.glass{position:absolute;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03) 50%,rgba(255,255,255,.06)),rgba(10,14,24,.55);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 40px 100px rgba(0,0,0,.6);backdrop-filter:blur(20px);overflow:hidden}
.pill{position:absolute;display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 32px 0 24px;border-radius:38px;font-weight:600;font-size:34px;white-space:nowrap;background:rgba(14,18,28,.88);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 20px 50px rgba(0,0,0,.5);z-index:5}
.pill.sm{height:58px;font-size:26px;padding:0 24px 0 18px;border-radius:29px}.pill.sm .ico{width:28px;height:28px}
.pill.dim{color:var(--dim)}
.pill.g{border-color:rgba(34,229,92,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 44px rgba(34,229,92,.35),0 20px 50px rgba(0,0,0,.5)}.pill.g .ico{color:var(--up)}
.pill.r{border-color:rgba(255,45,58,.7);box-shadow:0 0 44px rgba(255,45,58,.4),0 20px 50px rgba(0,0,0,.5)}.pill.r .ico{color:var(--down)}
.pill.xl{height:150px;font-size:84px;font-weight:700;padding:0 64px 0 48px;border-radius:75px;gap:26px;letter-spacing:-.035em}
.ico{fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lbl{font-weight:500;font-size:30px;color:var(--dim);display:flex;align-items:center;gap:12px}
.lbl.big{font-size:56px;font-weight:700;display:block}.lbl.r{color:var(--down);text-shadow:0 0 30px rgba(255,45,58,.5)}
svg.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
svg.gridsvg,svg.inner{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.grid line{stroke:rgba(255,255,255,.06);stroke-width:1}
.ln{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 22px rgba(34,229,92,.6))}
.ln.thick{stroke-width:6}.ln.faint{opacity:.35}.ln.red{stroke:#ffd6d9;filter:drop-shadow(0 0 8px rgba(255,45,58,.9)) drop-shadow(0 0 26px rgba(255,45,58,.7))}
.ln.dash{stroke-dasharray:10 16;stroke-width:3;opacity:.45;filter:none}
circle.hd{fill:#fff;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 26px var(--up))}
/* chart wave + rocket */
.wave{position:absolute;left:0;bottom:0;width:1200px;height:230px}
.wb{position:absolute;bottom:22px;width:28px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,rgba(34,229,92,.95),rgba(15,138,52,.25));transform-origin:50% 100%;box-shadow:0 0 18px rgba(34,229,92,.35)}
.rocket{position:absolute;width:170px;height:170px;z-index:6}.rk{color:#fff;filter:drop-shadow(0 0 14px rgba(255,255,255,.7)) drop-shadow(0 0 40px rgba(34,229,92,.8));position:relative;z-index:2}
.flame{position:absolute;left:68px;top:150px;width:34px;height:120px;border-radius:50%;background:radial-gradient(ellipse at 50% 10%,#fff 0,#b9ffd0 25%,rgba(34,229,92,.6) 50%,transparent 75%);transform-origin:50% 0;filter:blur(2px)}
.mini{position:absolute;width:20px;height:20px;border-radius:50%;background:#c9d2e0;box-shadow:0 0 20px rgba(255,255,255,.6);opacity:0}
.ring{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:4px solid var(--up);box-shadow:0 0 30px var(--up);opacity:0;z-index:7}
/* race */
.lane{position:absolute;left:180px;width:1500px;height:4px;transform-origin:0 50%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 34px,transparent 34px 68px)}
.finish{position:absolute;top:290px;width:6px;height:640px;background:linear-gradient(180deg,transparent,var(--up),transparent);box-shadow:0 0 30px var(--up)}
/* coins + bars + numbers */
.coins{position:absolute;inset:0}.coin{position:absolute;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b8c2d0 50%,#5d6676);box-shadow:0 0 16px rgba(255,255,255,.35)}
.coin::after{content:"$";position:absolute;inset:0;text-align:center;font:800 30px/48px var(--f);color:#28303d}
.vbar{position:absolute;border-radius:20px 20px 6px 6px;transform-origin:50% 100%}
.vbar.g{background:linear-gradient(180deg,#5dff8a,#22e55c 20%,#0f8a34 75%,rgba(15,138,52,.25));box-shadow:0 0 60px rgba(34,229,92,.45)}
.bignum{position:absolute;font-weight:800;font-size:170px;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.bignum.g,.stat .bignum{color:var(--up);text-shadow:0 0 50px rgba(34,229,92,.5)}
.year{position:absolute;font-size:56px;color:var(--dim)}.year b{font-size:96px;color:var(--ink);letter-spacing:-.04em}
.stat .lbl{position:absolute;left:52px;top:52px}.stat .bignum{left:48px;top:150px;font-size:180px}
/* doc */
.doc{position:absolute;width:560px;height:700px;border-radius:26px;background:linear-gradient(170deg,rgba(255,255,255,.16),rgba(255,255,255,.05)),rgba(12,16,26,.92);border:1px solid rgba(255,255,255,.25);box-shadow:0 40px 100px rgba(0,0,0,.6);padding:50px 50px;transform-origin:50% 100%}
.doc.back{opacity:0}.dh{display:flex;align-items:center;gap:16px;font-size:40px}.dh .ico{color:var(--up)}.dh span{margin-left:auto;font-size:26px;color:var(--dim)}
.dl{margin-top:40px}.dl i{display:block;height:16px;border-radius:8px;background:rgba(255,255,255,.16);margin:26px 0}
.btn{position:absolute;right:50px;bottom:50px;height:76px;padding:0 40px;border-radius:38px;font:700 32px/76px var(--f);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
.btn.g{background:var(--up);color:#04140a;border:none;box-shadow:0 0 40px rgba(34,229,92,.5)}
.btn.xl{right:auto;bottom:auto;height:150px;padding:0 70px 0 56px;border-radius:75px;font:700 76px/150px var(--f);letter-spacing:-.035em;display:inline-flex;align-items:center;gap:26px;background:rgba(14,18,28,.9);border:2px solid rgba(255,255,255,.3);box-shadow:0 30px 80px rgba(0,0,0,.6);z-index:5}
.btn.xl.on{background:var(--up);color:#04140a;border-color:var(--up);box-shadow:0 0 90px rgba(34,229,92,.6)}
.stamp{position:absolute;padding:6px 40px;border:9px solid var(--up);border-radius:20px;font:900 120px var(--f);color:var(--up);letter-spacing:.02em;text-shadow:0 0 30px rgba(34,229,92,.6);box-shadow:0 0 40px rgba(34,229,92,.4),inset 0 0 30px rgba(34,229,92,.3);opacity:0;z-index:6}
.cur{position:absolute;z-index:20;opacity:0}.cur svg{filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));position:relative;z-index:2}
.rip{position:absolute;left:-30px;top:-30px;width:64px;height:64px;border-radius:50%;border:3px solid #fff;opacity:0}
/* floor + beam + badge */
.floor{position:absolute;left:-400px;right:-400px;bottom:-60px;height:620px;transform:perspective(900px) rotateX(64deg);transform-origin:50% 100%;background-image:linear-gradient(rgba(120,170,255,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(120,170,255,.22) 2px,transparent 2px);background-size:90px 90px;-webkit-mask-image:linear-gradient(0deg,#000 20%,transparent 95%)}
.beam{position:absolute;width:200px;height:820px;margin-left:-100px;background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(170,255,200,.5) 30%,rgba(34,229,92,.0));filter:blur(28px)}
.badge{position:absolute;width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 86px var(--f);letter-spacing:-.04em;background:radial-gradient(circle at 35% 30%,#7dffa0,#22e55c 45%,#0f8a34);color:#04140a;box-shadow:0 0 80px rgba(34,229,92,.7);z-index:5}
/* record */
.hb{position:absolute;height:130px;width:0;border-radius:22px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:16px;padding-left:34px;font:700 40px var(--f);color:#04140a;background:linear-gradient(90deg,#0f8a34,#22e55c 70%,#7dffa0);box-shadow:0 0 60px rgba(34,229,92,.5)}
.thr{position:absolute;top:330px;width:8px;height:480px;margin-left:-4px;z-index:4}.thr i{position:absolute;left:0;width:8px;height:50%;background:repeating-linear-gradient(180deg,#fff 0 22px,transparent 22px 36px);box-shadow:0 0 18px rgba(255,255,255,.6)}.thr .t1{top:0;transform-origin:50% 100%}.thr .t2{top:50%;transform-origin:50% 0}
/* calendar */
.cal{position:absolute;width:210px;height:240px;border-radius:28px;background:linear-gradient(170deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),rgba(12,16,26,.9);border:1px solid rgba(255,255,255,.25);text-align:center;padding-top:26px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.cal b{display:block;font-size:40px;font-weight:700;color:var(--dim);letter-spacing:.06em}.cal span{display:block;font-size:130px;font-weight:800;line-height:1.05;letter-spacing:-.05em}
.cal.g{border-color:rgba(34,229,92,.7);box-shadow:0 0 60px rgba(34,229,92,.35)}.cal.g b{color:var(--up)}
.hd8{position:absolute;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 0 16px #fff,0 0 40px var(--up);opacity:0}
/* people */
.blob{position:absolute;width:200px;height:270px;transform-origin:50% 100%}
.blob .hd{position:absolute;left:40px;top:0;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#9aa3b4 42%,#2a3140 78%);box-shadow:0 0 40px rgba(255,255,255,.18)}
.blob .hd b{position:absolute;top:50px;width:11px;height:15px;border-radius:50%;background:#0a0d14}.blob .hd b:first-child{left:40px}.blob .hd b:last-child{left:68px}
.blob .bd{position:absolute;left:0;top:132px;width:200px;height:138px;border-radius:100px 100px 0 0;background:radial-gradient(ellipse at 40% 20%,#d7dde8,#6b7486 45%,rgba(30,36,48,.0) 95%)}
.blob.gr .hd{background:radial-gradient(circle at 36% 30%,#eafff0,#37d867 42%,#0b4a20 80%)}.blob.gr .bd{background:radial-gradient(ellipse at 40% 20%,#b9ffd0,#22a84a 45%,rgba(10,60,26,0) 95%)}
/* chip + magnifier */
.chip{position:absolute;padding:6px 34px;border-radius:22px;border:3px solid rgba(255,255,255,.4);font:800 96px var(--f);letter-spacing:-.04em}
.mag{position:absolute;color:#fff;filter:drop-shadow(0 0 16px rgba(255,255,255,.6))}
/* tiles + progress */
.tile{position:absolute;width:250px;height:250px;border-radius:32px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03)),rgba(10,14,24,.6);border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.tile b{font-size:32px;font-weight:600}
.prog{position:absolute;width:1000px;height:80px;border-radius:40px;border:2px solid rgba(255,255,255,.35);overflow:hidden;background:rgba(255,255,255,.04)}
.prog .fill{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 50%;background:linear-gradient(90deg,#0f8a34,#22e55c);box-shadow:0 0 40px rgba(34,229,92,.5)}
.prog .glint{position:absolute;top:0;left:-200px;width:160px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
/* super cycle */
.orbit{position:absolute;left:960px;top:470px;width:0;height:0;z-index:5}
.op{position:absolute;display:inline-flex;align-items:center;gap:12px;height:70px;padding:0 28px 0 20px;border-radius:35px;font:600 32px var(--f);white-space:nowrap;background:rgba(14,18,28,.9);border:1px solid rgba(34,229,92,.6);box-shadow:0 0 40px rgba(34,229,92,.3)}.op .ico{color:var(--up)}
.ocore{position:absolute;left:810px;top:320px;width:300px;height:300px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 30%,rgba(34,229,92,.35),rgba(10,14,24,.9) 70%);border:1px solid rgba(34,229,92,.6);box-shadow:0 0 80px rgba(34,229,92,.35)}
.ocore b{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1}.ocore span{font-size:30px;color:var(--dim);font-weight:500}
.oring{position:absolute;left:700px;top:210px;width:520px;height:520px;border-radius:50%;border:2px dashed rgba(255,255,255,.25)}
/* risks */
.warn{position:absolute;color:var(--down);filter:drop-shadow(0 0 30px rgba(255,45,58,.8))}
.globe{position:absolute;width:300px;height:300px;color:#e9eef6;display:flex;align-items:center;justify-content:center}
.globe .pr{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px;border-radius:50%;border:3px solid var(--down);opacity:0}
.flash{position:absolute;inset:0;background:radial-gradient(900px 500px at 50% 50%,rgba(34,229,92,.35),transparent 70%);opacity:0}
.blob.rd .hd{background:radial-gradient(circle at 36% 30%,#ffe9ea,#e0444f 42%,#4a0b10 80%)}.blob.rd .bd{background:radial-gradient(ellipse at 40% 20%,#ffc9cc,#b8323b 45%,rgba(60,10,14,0) 95%)}
.vbar.r{background:linear-gradient(180deg,#ff8a92,#ff2d3a 20%,#9b0f19 75%,rgba(155,15,25,.25));box-shadow:0 0 60px rgba(255,45,58,.45)}
.hb.r{background:linear-gradient(90deg,#9b0f19,#ff2d3a 70%,#ff8a92);color:#fff;box-shadow:0 0 60px rgba(255,45,58,.5)}
.bignum.r{color:var(--down);text-shadow:0 0 50px rgba(255,45,58,.5)}
/* faces */
.face{object-fit:cover;z-index:30;opacity:0}
.fover{z-index:31;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 3px rgba(34,229,92,.45),inset 0 0 60px rgba(34,229,92,.25),inset 0 0 260px rgba(0,0,0,.6)}
#fadeout{position:absolute;inset:0;background:#000;opacity:0;z-index:60}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>%ICONS%</defs></svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="%TOTAL%" data-width="1920" data-height="1080">
 <div id="bgw" class="clip" data-start="0" data-duration="%TOTAL%" data-track-index="0"><div class="bgl" id="b_n"></div><div class="bgl" id="b_g"></div><div class="bgl" id="b_r"></div><div id="dust">%DUST%</div><div id="sweep"><i class="sw1"></i><i class="sw2"></i></div><div id="vig"></div></div>
%SCENES%
%VIDS%
 <div id="fx" class="clip" data-start="0" data-duration="%TOTAL%" data-track-index="40" style="pointer-events:none;z-index:60"><div id="fadeout"></div></div>
</div>
<script>
gsap.registerPlugin(MotionPathPlugin);
const TOTAL=%TOTAL%, WORLDS=%WORLDS%, CAPS=%CAPS%;
const tl=gsap.timeline({paused:true}), q=(s,r=document)=>Array.from(r.querySelectorAll(s)), $=s=>document.querySelector(s);
// ---------- background: colour worlds, drifting dust (never still)
WORLDS.forEach(([t,k],i)=>{const el=$("#b_"+k);if(i===0){gsap.set(el,{opacity:1});return;}const p=$("#b_"+WORLDS[i-1][1]);if(p===el)return;tl.to(p,{opacity:0,duration:.8,ease:"sine.inOut"},t-.4);tl.to(el,{opacity:1,duration:.8,ease:"sine.inOut"},t-.4);});
tl.fromTo("#sweep .sw1",{x:0,y:0},{x:1500,y:180,duration:9,ease:"sine.inOut",yoyo:true,repeat:Math.ceil(TOTAL/9),immediateRender:false},0);
tl.fromTo("#sweep .sw2",{x:0,y:0},{x:-1400,y:-260,duration:11,ease:"sine.inOut",yoyo:true,repeat:Math.ceil(TOTAL/11),immediateRender:false},0);
q("#dust i").forEach((e,i)=>tl.to(e,{y:-420-(i%6)*90,x:(i%2?90:-90),duration:TOTAL,ease:"none"},0));
// ---------- scenes: blur-push in, slow camera push, blur-push out
const scenes=q(".scene");
scenes.forEach((sc,i)=>{const a=+sc.dataset.in,b=+sc.dataset.out,cam=sc.querySelector(".cam"),push=sc.querySelector(".push");
 tl.set(cam,{opacity:0},0);
 tl.fromTo(cam,{opacity:0,scale:1.06,filter:"blur(18px)"},{opacity:1,scale:1,filter:"blur(0px)",duration:.4,ease:"expo.out",immediateRender:false},a);
 tl.set(cam,{filter:"none"},a+.42);
 tl.fromTo(push,{scale:1,x:0,y:0},{scale:1.08,x:(i%2?-40:40),y:(i%3?-14:14),duration:Math.max(1,b-a+.5),ease:"none",immediateRender:false},a);
 if(b<TOTAL-.1){tl.set(cam,{filter:"blur(0px)"},b-.2);tl.to(cam,{opacity:0,scale:.95,filter:"blur(16px)",duration:.24,ease:"power2.in"},b-.2);}
 // idle float on everything that lands, so no frame is ever still
 q(".pill,.glass,.tile,.cal,.badge,.warn,.globe,.ocore,.btn.xl,.doc:not(.back)",sc).forEach((el,j)=>{const per=1.6+(j%3)*.35,n=Math.max(1,Math.ceil((b-a+.5)/per));
  const amp=Math.min(14,1400/Math.max(40,el.offsetHeight));tl.fromTo(el,{yPercent:0,rotation:0},{yPercent:(j%2?-amp:amp),rotation:(j%2?-.6:.6),duration:per,ease:"sine.inOut",yoyo:true,repeat:n,immediateRender:false},a);});
});
// ---------- entrance FX
const FX={
 in:[{opacity:0,y:30,filter:"blur(12px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.42,ease:"expo.out"}],
 pop:[{opacity:0,scale:.6,filter:"blur(10px)"},{opacity:1,scale:1,filter:"blur(0px)",duration:.45,ease:"back.out(1.7)"}],
 left:[{opacity:0,x:-80,filter:"blur(12px)"},{opacity:1,x:0,filter:"blur(0px)",duration:.45,ease:"expo.out"}],
 up:[{opacity:0,y:80,filter:"blur(12px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.5,ease:"expo.out"}],
 stamp:[{opacity:0,scale:1.4,filter:"blur(8px)"},{opacity:1,scale:1,filter:"blur(0px)",duration:.32,ease:"expo.out"}],
 fade:[{opacity:0},{opacity:1,duration:.5,ease:"sine.out"}],
 tilt:[{opacity:0,rotationX:18,y:80,transformPerspective:1600,filter:"blur(12px)"},{opacity:1,rotationX:0,y:0,filter:"blur(0px)",duration:.6,ease:"expo.out"}],
 growx:[{scaleX:0},{scaleX:1,duration:.7,ease:"expo.inOut"}],
 growy:[{scaleY:0},{scaleY:1,duration:.5,ease:"back.out(1.5)"}],
 growbar:[{scaleY:0},{scaleY:1,duration:1.0,ease:"expo.out"}],
};
q("[data-at]").forEach(el=>{const f=FX[el.dataset.fx||"in"],t=+el.dataset.at;tl.fromTo(el,f[0],Object.assign({},f[1],{immediateRender:true}),t);if(f[1].filter)tl.set(el,{filter:"none"},t+f[1].duration+.02);});
// ---------- captions: word by word on the spoken word, blur out upward
CAPS.forEach(([id,a,b])=>{q("#"+id+" .w").forEach(w=>{const t=+w.dataset.wt;tl.fromTo(w,{opacity:0,filter:"blur(14px)",y:18,rotationX:-35},{opacity:1,filter:"blur(0px)",y:0,rotationX:0,duration:.35,ease:"power3.out",immediateRender:true},t);});
 tl.to("#"+id,{opacity:0,y:-34,filter:"blur(12px)",duration:.26,ease:"power2.in"},b-.26);});
// ---------- counters, line draws, progress
q(".count").forEach(el=>{const o={v:+el.dataset.from||0},to=+el.dataset.to,dec=+(el.dataset.dec||0);const f=v=>v.toFixed(dec);el.textContent=f(o.v);tl.to(o,{v:to,duration:+el.dataset.d,ease:"power2.out",onUpdate:()=>el.textContent=f(o.v)},+el.dataset.c);});
q("[data-draw]").forEach(el=>{const [s,d]=el.dataset.draw.split(",").map(Number);el.style.strokeDasharray="1 1";el.style.strokeDashoffset="1";tl.fromTo(el,{strokeDashoffset:1},{strokeDashoffset:0,duration:d,ease:"power2.inOut",immediateRender:true},s);});
q("[data-progress]").forEach(el=>{const [a,d]=el.dataset.progress.split(",").map(Number);tl.fromTo(el,{scaleX:0},{scaleX:+el.dataset.to||1,duration:d,ease:"power1.inOut",immediateRender:true},a);});
// ---------- cursor helper
function click(cid,from,to,tMove,tClick){const c=$("#"+cid),r=c.querySelector(".rip");
 tl.set(c,{opacity:0,x:0,y:0},0);tl.to(c,{opacity:1,duration:.2},tMove);
 tl.to(c,{x:to[0]-from[0],y:to[1]-from[1],duration:tClick-tMove-.06,ease:"power3.inOut"},tMove);
 tl.to(c,{scale:.82,duration:.07,yoyo:true,repeat:1,transformOrigin:"0 0"},tClick);
 tl.fromTo(r,{opacity:.9,scale:.3},{opacity:0,scale:1.9,duration:.5,ease:"power2.out",immediateRender:false},tClick);
 tl.to(c,{x:"+=40",y:"+=50",opacity:0,duration:.5,ease:"power2.in"},tClick+.5);}

// ---------- data-driven behaviours used by lib.py helpers
q("[data-ride]").forEach(el=>{const [p,a,d]=el.dataset.ride.split(",");tl.to(el,{motionPath:{path:"#"+p,align:"#"+p,alignOrigin:[.5,.5]},duration:+d,ease:"power2.inOut"},+a);});
q("[data-click]").forEach(el=>{const [dx,dy,m,c]=el.dataset.click.split(",").map(Number),r=el.querySelector(".rip");
 tl.set(el,{opacity:0,x:0,y:0},0);tl.to(el,{opacity:1,duration:.2},m);tl.to(el,{x:dx,y:dy,duration:Math.max(.2,c-m-.06),ease:"power3.inOut"},m);
 tl.to(el,{scale:.82,duration:.07,yoyo:true,repeat:1,transformOrigin:"0 0"},c);
 tl.fromTo(r,{opacity:.9,scale:.3},{opacity:0,scale:1.9,duration:.5,ease:"power2.out",immediateRender:false},c);
 tl.to(el,{x:"+="+40,y:"+="+50,opacity:0,duration:.5,ease:"power2.in"},c+.5);});
q("[data-stamp]").forEach(el=>tl.fromTo(el,{opacity:0,scale:2.4,rotation:-22},{opacity:1,scale:1,rotation:-12,duration:.24,ease:"power4.in",immediateRender:true},+el.dataset.stamp));
q("[data-travel]").forEach(el=>{const [a,b,dx]=el.dataset.travel.split(",").map(Number);tl.fromTo(el,{opacity:0,x:0},{opacity:1,duration:.3,immediateRender:true},a-.4);tl.to(el,{x:dx,duration:Math.max(.3,b-a),ease:"sine.inOut"},a);});
q("[data-go]").forEach(el=>{tl.to(el,{x:+el.dataset.gox,duration:1.0,ease:"power3.inOut"},+el.dataset.go);});
q(".hb[data-w]").forEach(el=>{tl.fromTo(el,{width:0},{width:+el.dataset.w,duration:.9,ease:"expo.out",immediateRender:true},+el.dataset.t);if(el.dataset.t2)tl.to(el,{width:+el.dataset.w2,duration:.75,ease:"expo.inOut"},+el.dataset.t2);});
q("[data-break]").forEach(el=>{const t=+el.dataset.break;tl.to(el.querySelector(".t1"),{rotation:-24,x:-40,y:-30,opacity:.25,duration:.6,ease:"expo.out"},t);tl.to(el.querySelector(".t2"),{rotation:20,x:40,y:30,opacity:.25,duration:.6,ease:"expo.out"},t);});
q("[data-orbit]").forEach(el=>{const [a,d]=el.dataset.orbit.split(",").map(Number),ops=q(".op",el);ops.forEach(o=>gsap.set(o,{xPercent:-50,yPercent:-50}));
 tl.fromTo(el,{rotation:0,opacity:0},{rotation:140,opacity:1,duration:d,ease:"none",immediateRender:false},a);tl.fromTo(ops,{rotation:0},{rotation:-140,duration:d,ease:"none",immediateRender:false},a);});
q("[data-pulse]").forEach(el=>q(".pr",el).forEach((p,i)=>tl.fromTo(p,{opacity:.9,scale:.6},{opacity:0,scale:1.6,duration:1.1,repeat:3,ease:"power1.out",immediateRender:false},+el.dataset.pulse+.1+i*.55)));
q("[data-glint]").forEach(el=>tl.fromTo(el,{x:0},{x:1300,duration:1.2,repeat:2,ease:"power1.inOut",immediateRender:false},+el.dataset.glint+.1));
q("[data-on]").forEach(el=>tl.set(el,{attr:{class:el.className+" on"}},+el.dataset.on));
q("[data-shake]").forEach(el=>{const [a,d]=el.dataset.shake.split(",").map(Number);tl.to(el,{x:10,duration:.06,yoyo:true,repeat:Math.max(1,Math.round(d/.06)),ease:"sine.inOut"},a);tl.to(el,{x:0,duration:.06},a+d+.06);});
q(".flash[data-flash]").forEach(el=>tl.fromTo(el,{opacity:0},{opacity:1,duration:.3,yoyo:true,repeat:1,immediateRender:false},+el.dataset.flash));
// ---------- per-video custom moves (CUSTOM_JS in video.py)
%CUSTOM%
tl.to("#fadeout",{opacity:1,duration:.5,ease:"sine.in"},TOTAL-.5);
// ---------- faces: zoom-blur in, slow push, out
q(".face").forEach((v,k)=>{const a=+v.dataset.a,b=+v.dataset.b,o=$("#fo"+(k+1));
 tl.set([v,o],{opacity:0},0);
 tl.fromTo(v,{opacity:0,scale:1.12,filter:"blur(14px)"},{opacity:1,scale:1.0,filter:"blur(0px)",duration:.28,ease:"expo.out",immediateRender:false},a);
 tl.set(v,{filter:"none"},a+.3);
 tl.fromTo(v,{scale:1.0},{scale:1.05,duration:b-a,ease:"none",immediateRender:false},a+.28);
 tl.to(o,{opacity:1,duration:.3},a);
 tl.to([v,o],{opacity:0,duration:.22,ease:"power2.in"},b-.2);});
tl.set({}, {}, TOTAL);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;
</script>
</body>
</html>
